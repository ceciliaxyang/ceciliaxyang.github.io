<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Easy Korean side dishes with beginner recipes and a shared shopping list.">
<title>Banchan Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
[hidden] { display: none !important; }
/* Styled after Polish shelf: white page, system type, big rounded photo tiles with a frosted add button,
   grey scope pills, and a fixed pane on the right (a bottom sheet on phones) that lists what you picked. */
:root {
  --bg: #ffffff;
  --fg: #000000;
  --text: #222222;
  --muted: #6a6a6a;
  --soft: #6c6c6c;
  --line: #dddddd;
  --hair: #ebebeb;
  --swatch: #ececec;
  --pane: 348px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  padding-left: max(40px, env(safe-area-inset-left, 0px));
  padding-right: max(40px, env(safe-area-inset-right, 0px));
}
@media (max-width: 600px) { body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
button { font: inherit; color: inherit; }
a { color: inherit; }

.page { padding-block: 64px 60px; }
@media (max-width: 600px) { .page { padding-block: 40px 40px; } }

/* The pane's column (and the gap before it) opens as the pane slides in, pushing the shelf aside. */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) var(--pane); column-gap: 56px; align-items: start;
  transition: grid-template-columns .45s cubic-bezier(.2, .8, .2, 1), column-gap .45s cubic-bezier(.2, .8, .2, 1); }
.layout.closed { grid-template-columns: minmax(0, 1fr) 0px; column-gap: 0px; }
@media (max-width: 760px) { .layout, .layout.closed { grid-template-columns: minmax(0, 1fr); } }

/* Header */
.shelf-head { display: flex; flex-direction: column; gap: 24px; margin: 0 0 64px; padding: 0 8px; }
.shelf-title { margin: 0; font-size: 40px; line-height: 40px; font-weight: 500; letter-spacing: -1.2px; color: #000; }
.shelf-sub { margin: -8px 0 0; max-width: 60ch; font-size: 14px; line-height: 20px; color: var(--soft); }
.scopes { display: flex; gap: 8px; padding: 8px; margin: -8px; overflow-x: auto; scrollbar-width: none; }
.scopes::-webkit-scrollbar { display: none; }
.scope { flex-shrink: 0; min-width: 56px; padding: 12px 16px; border: 0; border-radius: 32px; background: #f2f2f2; color: var(--text);
  font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background .15s ease, color .15s ease; }
.scope:hover { background: #e8e8e8; }
.scope[aria-pressed="true"] { background: var(--text); color: #fff; }
.scope:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
@media (max-width: 600px) {
  .shelf-head { gap: 16px; margin-bottom: 40px; padding: 0; }
  .shelf-title { font-size: 32px; line-height: 40px; letter-spacing: -.9px; }
  .scopes { margin-inline: -16px; padding-inline: 16px; }
}

/* Shelf grid */
/* The column count is set from the full page width (see fitCols), so opening the pane shrinks the cards instead of reflowing them. */
.grid { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 56px 40px; }
.card { position: relative; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.card[hidden] { display: none; }
.card-link { display: flex; flex-direction: column; gap: 28px; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 20%; }
.card-link:focus-visible { outline: none; }
.card-link:focus-visible .photo, .card.viewing .photo { outline: 2px solid var(--text); outline-offset: 4px; }
.photo { display: block; position: relative; width: 100%; max-width: 100%; aspect-ratio: 240 / 260; border-radius: 20% / 18.5%; overflow: hidden; background: var(--swatch); }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
.card-link:hover .photo img { transform: scale(1.04); }
/* Frosted round button on the photo */
.add {
  position: absolute; top: 20px; right: 20px; z-index: 1;
  width: 40px; height: 40px; padding: 10px; border: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; background: rgba(17, 17, 17, .5);
  -webkit-backdrop-filter: blur(48px); backdrop-filter: blur(48px); cursor: pointer;
}
.add:hover { background: rgba(17, 17, 17, .62); }
.add:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.add svg { display: block; overflow: visible; }
.add .plus { transform-origin: 10px 10px; transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .2s ease; }
.add .check { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .2s ease; }
.add.on .plus { transform: rotate(90deg) scale(0); opacity: 0; }
.add.on .check { stroke-dashoffset: 0; transition: stroke-dashoffset .35s cubic-bezier(.3,.7,.3,1) .12s; }
.card-fx, .card-text, .card-title { display: flex; }
.card-text { display: flex; flex-direction: column; width: 100%; }
.card-title { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card-kr, .card-time { font-size: 14px; line-height: 18px; color: #6c6c6c; }
.card-time { font-variant-numeric: tabular-nums; }
.card-en { font-size: 20px; font-weight: 500; color: #000; }
.card-title > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-text, .card-title, .card-fx { box-sizing: border-box; }
.brand { font-size: 14px; color: #000; }
.brand .en { color: var(--soft); }
.name { font-size: 20px; font-weight: 500; color: #000; }
.card-fx { display: flex; flex-wrap: wrap; gap: 4px; }
.pill { border: 1px solid var(--line); border-radius: 32px; background: var(--bg); color: var(--text); padding: 6px 12px; font-size: 12px; line-height: 18px; font-variant-numeric: tabular-nums; }
.pill.go { border-color: var(--text); }
.card-link:hover .pill.go { background: var(--text); color: #fff; }
@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 16px; }
  .photo { border-radius: 32px; }
  .card, .card-link { gap: 16px; }
  .add { top: 12px; right: 12px; width: 36px; height: 36px; padding: 8px; }
  .name, .card-en { font-size: 17px; }
  .brand .en { display: none; }
}

/* Shopping list pane: fixed to the right edge; its left border is the divider between the panes. */
.bench { position: fixed; z-index: 60; top: 0; bottom: 0; right: 0;
  width: calc(28px + var(--pane) + max(40px, env(safe-area-inset-right, 0px)));
  overflow-y: auto; overscroll-behavior: contain;
  padding: calc(64px + env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-right, 0px)) 40px 28px;
  display: flex; flex-direction: column; gap: 24px; background: var(--bg); border-left: 1px solid var(--hair); scrollbar-width: none; }
.bench::-webkit-scrollbar { display: none; }
@media (min-width: 761px) {
  .bench { transform: translateX(100%); transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
  .bench.open { transform: none; }
}
@media (prefers-reduced-motion: reduce) { .layout, .bench { transition: none !important; } }
.bench-head { display: flex; align-items: flex-start; gap: 8px; }
/* Desktop: the title row stays put while the panel scrolls; the panel's 64px top padding collapses to 24px once stuck */
@media (min-width: 761px) {
  .bench-head { position: sticky; z-index: 2; top: calc(-64px - env(safe-area-inset-top, 0px)); margin-top: -24px; padding-top: 24px; background: var(--bg); }
}
.bench-titles { flex: 1; min-width: 0; }
.head-main { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 12px; }
/* Cooking plan: every dish's steps merged and grouped by phase */
.phase h3 { margin: 0; font-size: 16px; line-height: 20px; font-weight: 500; color: var(--text); }
.phase-sub { margin: 4px 0 0; font-size: 13px; line-height: 18px; color: var(--soft); }
.psteps { list-style: none; margin: 4px 0 0; padding: 0; }
.pstep { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.pstep input { flex-shrink: 0; margin: 2px 0 0; width: 16px; height: 16px; accent-color: var(--text); cursor: pointer; }
.pstep-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.pstep-t { font-size: 14px; line-height: 20px; color: var(--text); }
.pstep-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--soft); }
.pstep-meta > img { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; object-fit: cover; background: var(--swatch); }
.wait { padding: 2px 8px; border-radius: 20px; background: #f2f2f2; color: var(--text); font-size: 12px; font-weight: 500; }
.pstep.done .pstep-t { color: #a8a8a8; text-decoration: line-through; }
.bench-title { margin: 0; padding: 2px 0 12px; font-size: 40px; line-height: 40px; font-weight: 500; letter-spacing: -1.2px; color: #000; }
.peek { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left; cursor: default; }
.bench-title { display: block; }
.sheet-handle, .peek-mini, .peek-sub, .peek-thumbs { display: none; }
.dark-pill:focus-visible, .step button:focus-visible, .row-del:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.serv { display: flex; align-items: center; gap: 16px; padding: 4px 0; }
.serv-text { flex: 1; min-width: 0; }
.serv-text p { margin: 0; font-size: 14px; line-height: 18px; }
.serv-text .t { font-weight: 500; color: var(--text); }
.serv-text .s { color: var(--soft); margin-top: 4px; }
.step { display: inline-flex; align-items: center; gap: 4px; padding: 4px; border-radius: 100px; background: #f2f2f2; }
.step button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--text); }
.step button:hover { background: #e4e4e4; }
.step output { min-width: 24px; text-align: center; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }

.section-label { margin: 8px 0 -12px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--soft); }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 16px; min-height: 72px; border-bottom: 1px solid var(--hair); }
.row-thumb { flex-shrink: 0; width: 48px; height: 48px; border-radius: 12px; overflow: hidden; background: var(--swatch); }
.row-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row-text > span { display: block; margin: 0; font-size: 14px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-name { font-weight: 500; color: var(--text); }
.row-sub { color: var(--soft); }
.rows.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; align-items: center; min-width: 0; max-width: 100%; border-radius: 32px; background: #f2f2f2; }
.chip-open { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px; border: 0; background: none; color: var(--text); font-size: 13px; line-height: 16px; font-weight: 500; cursor: pointer; border-radius: 32px; }
.chip-open img { flex-shrink: 0; width: 28px; height: 28px; border-radius: 8px; object-fit: cover; background: var(--swatch); }
.chip-open span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-open:hover span { text-decoration: underline; }
.chip-x { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin: 0 4px 0 2px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--soft); cursor: pointer; }
.chip-x:hover { background: #e4e4e4; color: var(--text); }
.chip-open:focus-visible, .chip-x:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
/* Overlapping stack of the dishes that use an ingredient */
.uses { display: flex; padding-left: 6px; }
.uses img { flex-shrink: 0; width: 22px; height: 22px; margin-left: -6px; border-radius: 6px; border: 2px solid var(--bg); box-sizing: content-box; object-fit: cover; background: var(--swatch); }
.item-tip { color: var(--soft); }
.row-del { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin-right: -8px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--text); cursor: pointer; }
.row-del:hover { background: #f2f2f2; }

.aisle h3 { margin: 16px 0 0; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--soft); }
.item { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--hair); cursor: pointer; }
.item input { flex-shrink: 0; margin: 1px 0 0; width: 16px; height: 16px; accent-color: var(--text); cursor: pointer; }
.item-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 18px; }
.item-name { font-weight: 500; color: var(--text); }
.item-name .opt { font-weight: 400; color: var(--soft); }
.item-sub { color: var(--soft); font-size: 13px; }
.item-qty { flex-shrink: 0; text-align: right; font-size: 14px; line-height: 18px; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item-qty small { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: var(--soft); }
.item.have .item-name, .item.have .item-qty { color: #a8a8a8; text-decoration: line-through; }
.dark-pill { flex-shrink: 0; min-width: 56px; padding: 12px 16px; border: 0; border-radius: 32px; background: var(--text); color: #fff; font-size: 12px; line-height: 16px; font-weight: 500; cursor: pointer; }
.dark-pill:hover { background: #000; }
.note { margin: 0; font-size: 12px; line-height: 18px; color: var(--soft); }

/* Phones: the pane is a bottom sheet. Collapsed, only the peek bar shows; tap it to expand. */
@media (max-width: 760px) {
  .bench { --peek: calc(84px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; top: auto; bottom: 0; width: auto; border-left: 0;
    max-height: 82vh; gap: 16px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    border-radius: 24px 24px 0 0; box-shadow: 0 -4px 24px rgba(0, 0, 0, .12); overflow: hidden;
    transform: translateY(calc(100% - var(--peek))); transition: transform .38s cubic-bezier(.2, .8, .2, 1); }
  .bench.expanded { transform: none; overflow-y: auto; }
  .bench:not(.open) { transform: translateY(100%); }
  .bench-head { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 1fr auto auto; align-items: center; column-gap: 8px; padding: 8px 0 12px; background: var(--bg); cursor: pointer; }
  .sheet-handle { display: block; grid-column: 1 / -1; justify-self: center; width: 36px; height: 5px; margin-bottom: 10px; border-radius: 3px; background: #d9d9d9; }
  .peek { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; border-radius: 12px; }
  .peek:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }
  .bench-share { align-self: center; }
  .head-main { align-items: center; }
  .peek-mini { display: block; flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; overflow: hidden; background: var(--swatch); }
  .peek-mini img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .bench-title { font-size: 17px; line-height: 22px; letter-spacing: -.2px; padding: 0; }
  .peek-sub { display: block; margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .peek-thumbs { display: flex; flex-shrink: 0; padding-left: 8px; transition: opacity .2s ease; }
  .peek-thumbs img { width: 24px; height: 24px; margin-left: -8px; border-radius: 7px; object-fit: cover; box-shadow: 0 0 0 2px var(--bg); }
  .bench.expanded .peek-thumbs { display: none; }
  .bench-titles .bench-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #back:not([hidden]) + .peek .peek-mini { display: none; }
  body.bench-open .page { padding-bottom: calc(40px + 84px + env(safe-area-inset-bottom, 0px)); }
  @media (prefers-reduced-motion: reduce) { .bench { transition: none; } }
}
/* Recipe view in the pane: a big rounded photo (like the Layers stage), then ingredients and steps. */
.mh-btn { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 12px; border: 0; border-radius: 100px; background: #f2f2f2; color: var(--text); cursor: pointer; }
.mh-btn:hover { background: #ebebeb; }
.mh-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.view { display: flex; flex-direction: column; gap: 24px; }
.stage { flex-shrink: 0; width: 100%; aspect-ratio: 348 / 360; border-radius: 56px; overflow: hidden; background: var(--swatch); }
.stage img { display: block; width: 100%; height: 100%; object-fit: cover; }
.r-title { display: flex; flex-direction: column; gap: 8px; }
.r-title p { margin: 0; }
.r-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.grey-pill { display: inline-flex; align-items: center; gap: 6px; padding: 12px 16px; border-radius: 32px; background: #f2f2f2; color: var(--text); font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.grey-pill:hover { background: #ebebeb; }
.grey-pill:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.dark-pill.on { background: #f2f2f2; color: var(--text); }
.r-ings { list-style: none; margin: -12px 0 0; padding: 0; }
.r-ing { display: flex; align-items: baseline; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); font-size: 14px; line-height: 18px; }
.r-ing .n { flex: 1; min-width: 0; color: var(--text); }
.r-ing .n small { color: var(--soft); font-size: 13px; }
.r-ing .q { flex-shrink: 0; font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; text-align: right; }
.r-steps { margin: -8px 0 0; padding: 0; list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 16px; }
.r-steps li { counter-increment: step; display: flex; gap: 12px; font-size: 14px; line-height: 21px; color: var(--text); }
.r-steps li::before { content: counter(step); flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: #f2f2f2; font-size: 12px; line-height: 24px; text-align: center; font-weight: 500; }
.r-tip { margin: 0; padding: 14px 16px; border-radius: 20px; background: #f7f7f7; font-size: 13px; line-height: 19px; color: var(--text); }
.row-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; padding: 12px 0; border: 0; background: none; text-align: left; cursor: pointer; }
.row-open:hover .row-name { text-decoration: underline; }
.row-open:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 12px; }
@media (max-width: 760px) {
  .stage { width: min(100%, 280px); border-radius: 40px; align-self: center; }
}
/* Your dishes: floating card with the picked dishes and two action rows into the pane (Figma 2272:8090) */
.dock { position: fixed; z-index: 70; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 288px;
  display: flex; flex-direction: column; gap: 12px; padding: 32px 24px; border-radius: 24px; background: var(--bg);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .02), 0 2px 16px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .1); }
.dock-title { margin: 0 0 4px; font-size: 16px; line-height: 20px; font-weight: 500; color: var(--text); }
.dock-rows { list-style: none; margin: 0; padding: 0 0 13px; display: flex; flex-direction: column; gap: 12px; max-height: 261px; overflow-y: auto; scrollbar-width: none; }
.dock-rows::-webkit-scrollbar { display: none; }
.dock-row { flex-shrink: 0; display: flex; align-items: center; gap: 7px; height: 40px; }
.dock-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.dock-open img { flex-shrink: 0; width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: var(--swatch); }
.dock-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 18px; }
.dock-name, .dock-time { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-name { font-size: 14px; font-weight: 500; color: var(--text); }
.dock-time { font-size: 12px; font-weight: 400; color: var(--soft); }
.dock-open:hover .dock-name { text-decoration: underline; }
.dock-del { flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin: -4px -6px -6px 0; padding: 0; border: 0; border-radius: 50%; background: none; color: #8c8c8c; cursor: pointer; }
.dock-del:hover { background: #f2f2f2; color: var(--text); }
.dock-div { width: 100%; height: 1px; margin: 0; border: 0; background: var(--hair); }
.dock-action { display: flex; align-items: center; gap: 16px; width: calc(100% + 24px); min-height: 40px; margin: 0 -12px; padding: 8px 12px; border-radius: 12px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--text); }
.dock-action > svg { flex-shrink: 0; }

/* ---------- aggregation ---------- */
function aggregate() {
  const map = new Map();

    for (const [key, q, u, opt] of d.ing) {

// On desktop, scroll the open dish's card back into view once the pane has finished pushing the grid around.
function revealCard(id, waitForPane) {

  if (chip) { state.cat = chip.dataset.cat; renderScopes(); renderGrid(); }
});
document.addEventListener("change", e => {
  const dk = e.target.dataset && e.target.dataset.done;
  if (dk) { e.target.checked ? state.done.add(dk) : state.done.delete(dk); save(); e.target.closest(".pstep").classList.toggle("done", e.target.checked); return; }
  const k = e.target.dataset && e.target.dataset.have;
  if (!k) return;
  e.target.checked ? state.have.add(k) : state.have.delete(k);
  save(); e.target.closest(".item").classList.toggle("have", e.target.checked);
});
// × closes a dish's recipe back to whatever the pane showed before, or closes the pane.
$("closeRecipe").onclick = () => {
  if (state.view) state.view = null; else state.panel = null;
  renderBench();
};
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (state.view || state.panel) $("closeRecipe").click();
});
// A shared list travels in the link as #list.<dish>.<dish>~<servings>.
// The published preview can't see its own claude.ai address, so links made there point at it directly.
const HOME = /ceciliayang\.com$/.test(location.hostname) || location.protocol === "file:" ? location.href.split("#")[0] : "https://ceciliayang.com/banchan-party/";
function shareUrl() { return `${HOME}#list.${DISHES.filter(d => state.sel.has(d.id)).map(d => d.id).join(".")}~${state.serv}`; }
function openSharedList() {
  const m = location.hash.match(/^#list\.([a-z.]+)(?:~(\d+))?$/);
  if (!m) return;
  const ids = m[1].split(".").filter(id => DISHES.some(d => d.id === id));
  if (!ids.length) return;
  state.sel = new Set(ids); state.have = new Set(); state.done = new Set(); state.view = null; state.panel = null;
  if (m[2]) state.serv = Math.min(20, Math.max(1, +m[2]));
  save();
}
$("share").onclick = async () => {
  const url = shareUrl(), n = state.sel.size;
  const text = `Banchan party shopping list: ${n} dish${n > 1 ? "es" : ""}`;
  if (navigator.share) {
    try { await navigator.share({ title: "Banchan party", text, url }); return; }
    catch (err) { if (err.name === "AbortError") return; }
  }
  // No share sheet (e.g. Chrome on a Mac): on Apple devices, open Messages with the link filled in.
  if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) && window.top === window) {
    location.href = `sms:&body=${encodeURIComponent(`${text} ${url}`)}`;
    return;
  }
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Link copied. Paste it into Messages."); } catch { toast(url); } ta.remove(); };
  try { navigator.clipboard.writeText(url).then(() => toast("Link copied. Paste it into Messages."), fallback); } catch { fallback(); }
};
openSharedList();
fitCols(); renderScopes(); renderGrid(); renderBench();
</script>
