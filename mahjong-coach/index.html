<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mahjong Coach</title>
<meta name="description" content="Hong Kong style mahjong against three bots, with a coach that explains when there was a better move.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 80'%3E%3Crect x='2' y='2' width='56' height='76' rx='9' fill='%23fbf9f4' stroke='%23222' stroke-width='3'/%3E%3Ctext x='30' y='57' text-anchor='middle' font-size='46' font-weight='700' fill='%23c8302c' font-family='serif'%3E%E4%B8%AD%3C/text%3E%3C/svg%3E">
<!-- link previews (Messages, Slack, social): a mahjong tile with Guanyin on it -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://ceciliayang.com/mahjong-coach/">
<meta property="og:title" content="Mahjong Coach">
<meta property="og:description" content="Hong Kong style mahjong against three bots, with a coach that explains when there was a better move.">
<meta property="og:image" content="https://ceciliayang.com/mahjong-coach/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A white mahjong tile with Guanyin painted on its face.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <h1 class="visually-hidden">Mahjong coach</h1>

    <!-- The table: side players on the left and right; in the middle the player opposite, the white box
         (everyone's discards, then the latest move) and you -->
    <main class="table" id="table" aria-label="Mahjong table">
      <section class="seat seat-left" data-p="3"></section>
      <div class="center">
        <section class="seat seat-top" data-p="2"></section>
        <div class="felt">
          <div class="discards" id="discards" aria-label="Discards"></div>
          <hr class="felt-div">
          <div class="bar" id="bar"></div>
        </div>
        <section class="me" id="me" aria-label="Your hand">
          <div class="exposed" id="meExposed"></div>
          <div class="hand" id="hand"></div>
          <div class="me-plate" id="mePlate"></div>
        </section>
      </div>
      <section class="seat seat-right" data-p="1"></section>
    </main>

    <!-- phones: your part of the game (latest move + your tiles) lives in this bottom sheet -->
    <div class="sheet" id="sheet" aria-label="Your move and your hand"><button type="button" class="sheet-grab" id="sheetGrab" aria-label="Collapse your hand" aria-expanded="true"></button><hr class="sheet-div"></div>

    <!-- floating actions, bottom left -->
    <div class="fab">
      <button type="button" class="fab-btn light" id="newBtn">New game</button>
      <div class="settings-wrap">
        <button type="button" class="fab-btn light icon" id="settingsBtn" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
            <div class="settings" id="settings" role="group" aria-label="Settings" hidden>
              <div class="set-row set-static">
                <span class="set-text"><b>Difficulty</b><small>How well the other players play</small></span>
                <div class="seg" role="radiogroup" aria-label="Difficulty">
                  <button type="button" role="radio" data-diff="easy" aria-checked="false">Easy</button>
                  <button type="button" role="radio" data-diff="normal" aria-checked="true">Normal</button>
                  <button type="button" role="radio" data-diff="hard" aria-checked="false">Hard</button>
                </div>
              </div>
              <hr class="set-sep">
              <button type="button" class="set-row" id="sortBtn" role="switch" aria-checked="true">
                <span class="set-text"><b>Autosort</b><small>Keep your hand and the discards sorted. Off: drag your tiles yourself</small></span><span class="switch" aria-hidden="true"></span>
              </button>
              <button type="button" class="set-row" id="flowersBtn" role="switch" aria-checked="true">
                <span class="set-text"><b>Play without flowers</b><small>Leave the flower and season tiles out. Starts with the next hand</small></span><span class="switch" aria-hidden="true"></span>
              </button>
              <button type="button" class="set-row" id="scoresBtn" role="switch" aria-checked="false">
                <span class="set-text"><b>Play with points</b><small>A win needs at least 1 point, and everyone's score shows by their name. Off: any complete hand wins</small></span><span class="switch" aria-hidden="true"></span>
              </button>
              <button type="button" class="set-row" id="claimedBtn" role="switch" aria-checked="false">
                <span class="set-text"><b>Claimed tiles</b><small>Outline the tile in each called set that was taken from a discard</small></span><span class="switch" aria-hidden="true"></span>
              </button>
              <button type="button" class="set-row" id="soundBtn" role="switch" aria-checked="true">
                <span class="set-text"><b>Sound</b><small>Tile clatter when the tiles are shuffled and dealt</small></span><span class="switch" aria-hidden="true"></span>
              </button>
              <hr class="set-sep">
              <button type="button" class="set-row" id="guideBtn">
                <span class="set-text"><b>Fan guide</b><small>Every scoring pattern and how many fan it's worth</small></span>
                <svg class="set-chev" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
      </div>
    </div>
  </div>

  <button type="button" class="coach fab-btn" id="coach" aria-label="Open coach"><span id="coachAv"></span>Coach me</button>
  <button type="button" class="bubble" id="bubble" hidden></button>

  <aside class="pane" id="pane" aria-label="Coach" aria-hidden="true">
    <div class="pane-head">
      <button type="button" class="icon-btn" id="paneBack" aria-label="All notes" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h2 class="pane-title"><span class="visually-hidden">Coach</span><span id="paneAv"></span></h2>
      <button type="button" class="icon-btn" id="paneClose" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none"><path d="M1.5 1.5L16.5 16.5M16.5 1.5L1.5 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="pane-body" id="paneBody"></div>
  </aside>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
