<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f2ec">
<title>Mahjong Coach</title>
<meta name="description" content="Hong Kong style mahjong against three bots, with a coach that explains when there was a better move.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 80'%3E%3Crect x='2' y='2' width='56' height='76' rx='9' fill='%23fbf9f4' stroke='%23222' stroke-width='3'/%3E%3Ctext x='30' y='57' text-anchor='middle' font-size='46' font-weight='700' fill='%23c8302c' font-family='serif'%3E%E4%B8%AD%3C/text%3E%3C/svg%3E">
<!-- link previews (Messages, Slack, social): a mahjong tile with Guanyin on it -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://ceciliayang.com/mahjong-coach/">
<meta property="og:title" content="Mahjong Coach">
<meta property="og:description" content="Hong Kong style mahjong against three bots, with a coach that explains when there was a better move.">
<meta property="og:image" content="https://ceciliayang.com/mahjong-coach/og-image.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Mahjong tiles scattered face up across a warm beige table.">
<meta name="twitter:card" content="summary_large_image">
<!-- Tile characters: LXGW WenKai TC first (the same in every browser), Klee One if that can't load, then
     Kaiti (Safari can't use Kaiti: it's an optional macOS download). Only the tile characters (both scripts, 萬 for Cantonese, and 碰 槓 杠 吃 for the call button) are fetched
     (the text= list), so it's tiny. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Klee+One:wght@600&display=swap&text=%E4%B8%80%E4%BA%8C%E4%B8%89%E5%9B%9B%E4%BA%94%E5%85%AD%E4%B8%83%E5%85%AB%E4%B9%9D%E6%9D%B1%E5%8D%97%E8%A5%BF%E5%8C%97%E4%B8%AD%E7%99%BC%E6%A2%85%E8%98%AD%E8%8F%8A%E7%AB%B9%E6%98%A5%E5%A4%8F%E7%A7%8B%E5%86%AC%E7%A2%B0%E6%A7%93%E5%90%83%E4%B8%9C%E5%8F%91%E5%85%B0%E6%9D%A0%E8%90%AC">
<!-- Interface text: SF Pro on Apple devices; everywhere else Inter (only downloaded where it's used), set at -0.4px
     (SF Pro is set at -0.2px). The class below tells the page which one it got. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<!-- the landing's title -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap">
<script>
  // SF Pro is the system font on Apple devices (and on any computer that has it installed); elsewhere, Inter
  if (!/Macintosh|Mac OS X|iPhone|iPad|iPod/.test(navigator.userAgent)) document.documentElement.classList.add("no-sf");
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <h1 class="visually-hidden">Mahjong coach</h1>

    <!-- The table: side players on the left and right; in the middle the player opposite, the white box
         (everyone's discards, then the latest move) and you -->
    <main class="table" id="table" aria-label="Mahjong table">
      <section class="seat seat-left" data-p="3"></section>
      <div class="center">
        <section class="seat seat-top" data-p="2"></section>
        <div class="felt">
          <div class="discards" id="discards" aria-label="Discards"></div>
          <hr class="felt-div">
          <div class="bar" id="bar"></div>
        </div>
        <section class="me" id="me" aria-label="Your hand">
          <div class="exposed" id="meExposed"></div>
          <div class="hand" id="hand"></div>
          <div class="me-plate" id="mePlate"></div>
        </section>
      </div>
      <section class="seat seat-right" data-p="1"></section>
    </main>

    <!-- phones: your part of the game (latest move + your tiles) lives in this bottom sheet -->
    <div class="sheet" id="sheet" aria-label="Your move and your hand"><button type="button" class="sheet-grab" id="sheetGrab" aria-label="Collapse your hand" aria-expanded="true"></button><hr class="sheet-div"></div>

    <!-- floating actions, bottom left -->
    <div class="fab">
      <button type="button" class="fab-btn light" id="newBtn">New game</button>
      <div class="settings-wrap">
        <button type="button" class="fab-btn light icon" id="settingsBtn" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settings"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
            <div class="settings" id="settings" role="group" aria-label="Settings" hidden>
              <!-- phones only (the Settings sheet): a title and a close button -->
              <div class="settings-head">
                <h2>Settings</h2>
                <button type="button" class="icon-btn" id="settingsClose" aria-label="Close settings">
                  <svg width="14" height="14" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M1.5 1.5L16.5 16.5M16.5 1.5L1.5 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
              </div>
              <!-- Figma 2442:36283: two choices, then the "Play with" toggles, each with an icon -->
              <div class="set-row set-static">
                <span class="set-text"><b>Difficulty level</b></span>
                <div class="seg" role="radiogroup" aria-label="Difficulty level">
                  <button type="button" role="radio" data-diff="easy" aria-checked="false">Easy</button>
                  <button type="button" role="radio" data-diff="normal" aria-checked="true">Normal</button>
                  <button type="button" role="radio" data-diff="hard" aria-checked="false">Hard</button>
                </div>
              </div>
              <div class="set-row set-static">
                <span class="set-text"><b>Language</b></span>
                <div class="seg" role="radiogroup" aria-label="Language">
                  <button type="button" role="radio" data-lang="mandarin" aria-checked="false">Mandarin</button>
                  <button type="button" role="radio" data-lang="cantonese" aria-checked="true">Cantonese</button>
                </div>
              </div>
              <hr class="set-sep">
              <div class="set-heading" id="playWithLabel">Play with</div>
              <div role="group" aria-labelledby="playWithLabel">
                <button type="button" class="set-row set-toggle" id="sortBtn" role="switch" aria-checked="true" title="Keep your hand and the discards sorted. Off: drag your tiles yourself">
                  <svg class="set-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M11.7497 7.00001V13.189L13.9697 10.969L15.0297 12.03L11.7067 15.354C11.5345 15.5262 11.3054 15.6296 11.0624 15.6449C10.8194 15.6602 10.5791 15.5863 10.3867 15.437L10.2927 15.354L6.96973 12.03L8.02973 10.97L10.2497 13.189V7.00001H11.7497ZM5.61273 0.563011L5.70673 0.646011L9.02973 3.97001L7.96973 5.03001L5.74973 2.81001V9.00001H4.24973V2.81001L2.02973 5.03001L0.969727 3.97001L4.29273 0.646011C4.46492 0.473834 4.69402 0.370403 4.93705 0.355122C5.18007 0.33984 5.42032 0.413759 5.61273 0.563011V0.563011Z" fill="currentColor"/></svg><span class="set-text"><b>Autosort</b></span><span class="switch" aria-hidden="true"></span>
                </button>
                <button type="button" class="set-row set-toggle" id="flowersBtn" role="switch" aria-checked="false" title="The flower and season tiles. Starts with the next hand">
                  <svg class="set-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M7.50395 15.0529L7.51145 15.0519C7.52309 15.174 7.57959 15.2873 7.67002 15.3701C7.76045 15.4529 7.87837 15.4991 8.00095 15.4999C8.12342 15.4999 8.24162 15.455 8.33314 15.3736C8.42466 15.2922 8.48312 15.1801 8.49745 15.0584L8.49945 15.0264C8.69795 13.2899 10.1725 11.9999 11.9755 11.9999C12.714 11.9999 13.4155 12.2284 14.002 12.6459L14.001 11.4824C13.3733 11.1645 12.6795 10.9992 11.976 10.9999C10.576 10.9999 9.32695 11.6159 8.50095 12.5999V10.4499C9.64195 10.2179 10.501 9.20945 10.501 7.99995C11.164 7.99995 11.7999 7.73655 12.2687 7.26771C12.7376 6.79887 13.001 6.16299 13.001 5.49995C13.001 4.8369 12.7376 4.20102 12.2687 3.73218C11.7999 3.26334 11.164 2.99995 10.501 2.99995C10.5001 2.34686 10.2437 1.72004 9.78667 1.25354C9.32961 0.787054 8.70815 0.517939 8.05522 0.503764C7.40229 0.489588 6.76973 0.731477 6.29285 1.17769C5.81598 1.6239 5.53264 2.23901 5.50345 2.89145L5.50095 2.99995C4.84787 3.00079 4.22104 3.25716 3.75455 3.71422C3.28806 4.17129 3.01895 4.79275 3.00477 5.44568C2.9906 6.09861 3.23248 6.73117 3.6787 7.20804C4.12491 7.68492 4.74002 7.96826 5.39245 7.99745L5.50095 7.99995C5.50093 8.57625 5.69997 9.13487 6.06441 9.58131C6.42885 10.0277 6.93631 10.3346 7.50095 10.4499V12.6174C6.66595 11.6244 5.39745 10.9999 3.98695 10.9999C3.28745 10.9999 2.61195 11.1599 2.00295 11.4599L2.00195 12.6169C2.58535 12.2139 3.27789 11.9987 3.98695 11.9999C5.80845 11.9999 7.31845 13.3114 7.50395 15.0529ZM9.50095 5.49995C9.50095 5.89777 9.34292 6.2793 9.06161 6.56061C8.78031 6.84191 8.39878 6.99995 8.00095 6.99995C7.60313 6.99995 7.2216 6.84191 6.94029 6.56061C6.65899 6.2793 6.50095 5.89777 6.50095 5.49995C6.50095 5.10212 6.65899 4.72059 6.94029 4.43929C7.2216 4.15798 7.60313 3.99995 8.00095 3.99995C8.39878 3.99995 8.78031 4.15798 9.06161 4.43929C9.34292 4.72059 9.50095 5.10212 9.50095 5.49995Z" fill="currentColor"/></svg><span class="set-text"><b>Flowers</b></span><span class="switch" aria-hidden="true"></span>
                </button>
                <button type="button" class="set-row set-toggle" id="scoresBtn" role="switch" aria-checked="false" title="A win needs at least 1 point, and everyone's score shows by their name. Off: any complete hand wins">
                  <svg class="set-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.25" y="1.25" width="13.5" height="13.5" rx="2.75" stroke="currentColor" stroke-width="1.5"/><circle cx="4.9" cy="4.9" r="1.2" fill="currentColor"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/><circle cx="11.1" cy="11.1" r="1.2" fill="currentColor"/></svg><span class="set-text"><b>Points</b></span><span class="switch" aria-hidden="true"></span>
                </button>
                <button type="button" class="set-row set-toggle" id="specialBtn" role="switch" aria-checked="false" title="Seven pairs and thirteen orphans also win. Off: a win is always four sets and a pair">
                  <svg class="set-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.25" y="3.25" width="3.5" height="9.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="5.25" y="3.25" width="3.5" height="9.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="11.25" y="3.25" width="3.5" height="9.5" rx="1" fill="currentColor" stroke="currentColor" stroke-width="1.5"/></svg><span class="set-text"><b>Special hands</b></span><span class="switch" aria-hidden="true"></span>
                </button>
                <button type="button" class="set-row set-toggle" id="soundBtn" role="switch" aria-checked="true" title="Tile clatter when the tiles are shuffled and dealt">
                  <svg class="set-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M15.5758 8.00015C15.5758 11.4276 13.1498 14.2971 9.92578 14.9886V13.6481C12.4258 12.9831 14.2758 10.7066 14.2758 8.00015C14.2758 5.29365 12.4258 3.01715 9.92578 2.35215V1.01165C13.1498 1.70315 15.5758 4.57215 15.5758 8.00015ZM12.5758 8.00015C12.5758 6.24115 11.4738 4.73815 9.92578 4.13515V5.58115C10.3381 5.83613 10.6785 6.19214 10.9147 6.61545C11.151 7.03876 11.2752 7.51537 11.2758 8.00015C11.2752 8.48491 11.1509 8.96151 10.9146 9.38481C10.6784 9.80812 10.338 10.1641 9.92578 10.4191V11.8651C11.4738 11.2621 12.5758 9.75865 12.5758 8.00015ZM7.61728 1.03815C7.52591 1.00023 7.42533 0.990298 7.3283 1.00961C7.23127 1.02893 7.14217 1.07662 7.07228 1.14665L3.21878 5.00015H1.42578C0.874281 5.00015 0.425781 5.44865 0.425781 6.00015V10.0001C0.425781 10.5516 0.874281 11.0001 1.42578 11.0001H3.21878L7.07228 14.8536C7.14211 14.9238 7.23121 14.9716 7.32827 14.991C7.42533 15.0105 7.52597 15.0006 7.61742 14.9627C7.70887 14.9249 7.787 14.8607 7.8419 14.7783C7.89681 14.6959 7.926 14.5991 7.92578 14.5001V1.50015C7.92581 1.40126 7.89651 1.30459 7.8416 1.22236C7.78669 1.14013 7.70862 1.07602 7.61728 1.03815Z" fill="currentColor"/></svg><span class="set-text"><b>Sound</b></span><span class="switch" aria-hidden="true"></span>
                </button>
              </div>
            </div>
      </div>
      <button type="button" class="fab-btn light icon" id="undoBtn" aria-label="Undo your last move" title="Undo" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    </div>
  </div>

  <button type="button" class="coach" id="coach" aria-label="Open coach" title="Coach me"><span id="coachAv"></span></button>
  <button type="button" class="bubble" id="bubble" hidden></button>

  <aside class="pane" id="pane" aria-label="Coach" aria-hidden="true">
    <div class="pane-head">
      <h2 class="pane-title"><span class="visually-hidden">Coach</span><span id="paneAv"></span></h2>
      <button type="button" class="icon-btn" id="paneClose" aria-label="Close coach">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none"><path d="M1.5 1.5L16.5 16.5M16.5 1.5L1.5 16.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="pane-body" id="paneBody"></div>
  </aside>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
